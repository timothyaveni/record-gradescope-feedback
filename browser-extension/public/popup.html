<!-- src/popup.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OBS Control</title>
    <script type="module" src="popup.js"></script>

    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 0;
        padding: 20px;

        max-width: 400px;
      }

      main {
        max-width: 600px;
        margin: 0 auto;
        background-color: white;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;

        word-break: break-all;
      }

      h1 {
        color: #4a90e2;
        text-align: center;
      }

      p {
        margin: 10px 0;
      }

      label {
        font-weight: bold;
      }

      input[type='text'],
      input[type='number'],
      input[type='password'],
      textarea {
        width: calc(100% - 20px);
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        background-color: #4a90e2;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background-color: #357ab8;
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .status-indicators {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="status-indicators">
      <div id="status">Loading...</div>
      <div id="detectedFilename"></div>
      <div id="filename"></div>
    </div>

    <div class="buttons">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn">Stop Recording</button>
      <button id="retryObsBtn">Retry OBS connection</button>
      <button id="resetBtn">Reset Filename</button>
      <button id="settingsBtn">Settings</button>
    </div>
  </body>
</html>
